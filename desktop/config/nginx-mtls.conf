# SixWays Desktop Sandbox -- NGINX mTLS termination proxy
# Terminates TLS with client certificate verification, then proxies
# to Selkies-GStreamer on the internal loopback port.

error_log /dev/stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    server {
        listen 8081 ssl;

        ssl_certificate     /etc/sixways/tls/server.crt;
        ssl_certificate_key /etc/sixways/tls/server.key;
        ssl_client_certificate /etc/sixways/tls/ca.crt;
        ssl_verify_client on;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Allow large bodies for WebRTC signaling
        client_max_body_size 0;

        location / {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;

            # WebSocket upgrade support (Selkies signaling)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Long-lived WebSocket connections
            proxy_read_timeout 86400;
        }
    }
}
