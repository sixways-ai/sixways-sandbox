; SixWays Desktop Sandbox - supervisord configuration
; Manages: Xvfb, PulseAudio, Xfce4, Selkies-GStreamer, Agent
; NOTE: TURN relay runs on the host (embedded in sixwaysd), not in this container.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/opt/sixways/start-xvfb.sh
priority=1
autorestart=true
stdout_logfile=/tmp/xvfb.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[program:pulseaudio]
command=pulseaudio --disallow-exit --disallow-module-loading --exit-idle-time=-1 --log-target=stderr
user=1000
priority=3
autorestart=true
stdout_logfile=/tmp/pulseaudio.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[program:xfce4]
command=startxfce4
user=1000
priority=5
autorestart=true
stdout_logfile=/tmp/xfce4.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[program:sixways-theme]
command=/opt/sixways/apply-theme.sh
user=1000
priority=10
startsecs=0
autorestart=false
stdout_logfile=/tmp/sixways-theme.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[program:setup-tls]
command=/opt/sixways/setup-tls.sh
priority=0
startsecs=0
autorestart=false
stdout_logfile=/tmp/setup-tls.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[program:nginx]
command=nginx -g 'daemon off;' -c /etc/sixways/nginx-mtls.conf
priority=18
autorestart=true
stdout_logfile=/tmp/nginx.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[program:selkies]
command=/opt/sixways/start-selkies.sh
user=1000
priority=20
autorestart=true
stdout_logfile=/tmp/selkies.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

[program:sixways-agent]
command=/desktop-entrypoint.sh
user=1000
priority=25
startsecs=0
autorestart=false
stdout_logfile=/tmp/sixways-agent.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true
