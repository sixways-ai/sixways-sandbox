# SixWays IDE Sandbox -- NGINX mTLS termination proxy
# Terminates TLS with client certificate verification, then proxies
# to code-server on the internal loopback port.

user sandbox sandbox;
error_log /var/log/nginx/error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /var/log/nginx/access.log;
    server {
        listen 8080 ssl;

        ssl_certificate     /etc/sixways/tls/server.crt;
        ssl_certificate_key /etc/sixways/tls/server.key;
        ssl_client_certificate /etc/sixways/tls/ca.crt;
        ssl_verify_client on;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Allow large bodies for file uploads
        client_max_body_size 0;

        location / {
            proxy_pass http://127.0.0.1:8085;
            proxy_http_version 1.1;

            # WebSocket upgrade support (code-server uses WebSockets)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Use upstream host so code-server's WebSocket origin check passes.
            # code-server rejects WebSockets when Host doesn't match its bind address.
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            # Long-lived WebSocket connections
            proxy_read_timeout 86400;
        }
    }
}
